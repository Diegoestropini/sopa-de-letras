<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sopa de Letras</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <div class="panel">
        <h1>Sopa de Letras</h1>
        <div class="controls">
          <label>
            Tamaño:
            <input id="sizeInput" type="number" min="6" max="20" value="12" />
          </label>
          <button id="regenBtn">Regenerar</button>
        </div>
        <ul id="wordList" class="word-list" aria-label="Palabras"></ul>
      </div>
      <div class="board" id="app" aria-label="Sopa de letras" role="grid"></div>
    </div>

    <div id="toastContainer" class="toasts" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
